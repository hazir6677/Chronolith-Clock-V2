name: chronolith
description: "Chronolith — Material 3 Expressive 5-Tab Android Clock Suite (Alarm, Clock, World Clock, Timer, Stopwatch) built with Flutter."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/mountain_sunset.png
    - assets/images/avatar_sunset.png
    - assets/images/app_icon.png
