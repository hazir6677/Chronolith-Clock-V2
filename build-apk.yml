name: Build & Release Android APK

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android wrapper and apply Chronolith native layer
        run: |
          rm -rf android
          flutter create . --project-name chronolith --org dev.chronolith --platforms android
          # Manifest, alarm engine (Kotlin), launcher icon resources
          cp -r android_overlay/. android/
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronolith-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 60
