name: Build & Release Android APK

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android Wrapper, App Icon & Native Alarm Engine
        run: |
          mkdir -p /tmp/icon_backup
          if [ -f "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" ]; then
            cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png /tmp/icon_backup/custom_icon.png
          fi
          rm -rf android
          flutter create . --project-name chronolith --org dev.chronolith --platforms android
          mkdir -p assets/images
          if [ -f "app_icon.png" ]; then cp app_icon.png assets/images/app_icon.png; fi
          if [ -f "1000049589.png" ]; then cp 1000049589.png assets/images/app_icon.png; fi
          if [ -f "/tmp/icon_backup/custom_icon.png" ] && [ ! -f "assets/images/app_icon.png" ]; then
            cp /tmp/icon_backup/custom_icon.png assets/images/app_icon.png
          fi
          if [ ! -f "assets/images/app_icon.png" ] && [ -f "assets/images/avatar_sunset.png" ]; then
            cp assets/images/avatar_sunset.png assets/images/app_icon.png
          fi
          if [ -f "assets/images/app_icon.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            cp assets/images/app_icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp assets/images/app_icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp assets/images/app_icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp assets/images/app_icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp assets/images/app_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi
          mkdir -p android/app/src/main/kotlin/dev/chronolith/chronolith
          echo "" | base64 -d > android/app/src/main/AndroidManifest.xml
          echo "" | base64 -d > android/app/src/main/kotlin/dev/chronolith/chronolith/AlarmReceiver.kt
          echo "" | base64 -d > android/app/src/main/kotlin/dev/chronolith/chronolith/MainActivity.kt
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronolith-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 60
